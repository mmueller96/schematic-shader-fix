plugins {
	id 'net.fabricmc.fabric-loom' version '1.18.+'
}

repositories {
	maven { url = 'https://api.modrinth.com/maven'
		content { includeGroup("maven.modrinth") }
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.fabric_loader_version}"

	compileOnly "maven.modrinth:litematica:${project.litematica_version}"
	compileOnly "maven.modrinth:malilib:${project.malilib_version}"
	compileOnly "maven.modrinth:iris:${project.iris_version}"
}

base {
	group = project.group
	archivesName = project.mod_file_name + '-' + project.minecraft_version
	version = project.mod_version
}

processResources {
	inputs.property "mod_version", project.mod_version

	filesMatching("fabric.mod.json") {
		expand "mod_version": project.mod_version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

jar {
	from("LICENSE.txt") {
		rename { "LICENSE_${base.archivesName.get()}.txt" }
	}
}
