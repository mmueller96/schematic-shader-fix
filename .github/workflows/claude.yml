name: Claude

# Runs when the repository owner mentions @claude in an issue or pull request,
# e.g. "@claude review this pull request" or "@claude update to Litematica 0.29.2".
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event.comment.author_association == 'OWNER' && contains(github.event.comment.body, '@claude')) ||
      (github.event.review.author_association == 'OWNER' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 60
            --allowedTools "Bash(./gradlew:*),Bash(unzip:*),Bash(javap:*),Bash(find:*),Bash(ls:*),Bash(cat:*),Bash(grep:*)"
